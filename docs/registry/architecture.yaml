#       - docs/architecture/adr-0003-combat-system.md
#       - docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#     revised: ""


# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: save_write
    status: active
    budget_ms: 50
    adr: docs/architecture/adr-0001-save-system.md
    notes: "Per-run save serialisation + Sandbox.Storage write at steady-state studio (60 hires, full inventory). Run on a fire-and-forget Task to keep main-thread frame budget intact."
    referenced_by:
      - docs/architecture/adr-0001-save-system.md
    added: 2026-04-30
    revised: ""

  - system: save_load
    status: active
    budget_ms: 250
    adr: docs/architecture/adr-0001-save-system.md
    notes: "Per-run load: read JSON + reconstruct GameObjects (rehire NPCs, reapply placements). Largest expected save (year 5+ studio)."
    referenced_by:
      - docs/architecture/adr-0001-save-system.md
    added: 2026-04-30
    revised: ""

