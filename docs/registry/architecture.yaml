# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: per_run_save_storage
    status: active
    api: Sandbox.Storage.CreateEntry / saveEntry.Files.WriteJson
    not: per-component scene-snapshot serialisation
    adr: docs/architecture/adr-0001-save-system.md
    reason: "Multi-slot saves are a tycoon-genre expectation. Storage gives slots + metadata + thumbnails first-class; rolling our own on FileSystem.Data would reinvent it. Scene snapshot rejected because the project's known [Property] serialization quirk silently corrupts saves on schema change."
    referenced_by:
      - docs/architecture/adr-0001-save-system.md
    added: 2026-04-30
    revised: ""

  - purpose: cross_run_persistence
    status: active
    api: Sandbox.FileSystem.Data.WriteJson / ReadJson<T>
    not: Sandbox.Storage
    adr: docs/architecture/adr-0001-save-system.md
    reason: "Meta-progression (Hall of Fame, carryover unlocks) and Settings are single-file, not slot-based. FileSystem.Data is the simpler API for that shape; Storage's multi-slot ceremony adds nothing for these domains."
    referenced_by:
      - docs/architecture/adr-0001-save-system.md
    added: 2026-04-30
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: dto_with_component_reference
    status: active
    description: "A persisted DTO must not hold a Sandbox.Component (or any GameObject) reference. Use a stable identifier instead — Guid for slots, name/Id for hires, ItemKind enum for items."
    why: "Components are scene objects, not data. Serialising one either loops or captures stale references that break on load. The save layer is the system-of-record for state; components are reconstructed from it."
    adr: docs/architecture/adr-0001-save-system.md
    added: 2026-04-30

  - pattern: dto_with_field_not_property
    status: active
    description: "DTOs persisted via FileSystem.Data.WriteJson / Storage.Files.WriteJson must declare data members as public auto-properties, not fields. C# auto-properties (`public T Foo { get; set; }`) are the only valid form."
    why: "s&box's WriteJson / ReadJson<T> persist properties only — fields are silently ignored. A field-based DTO loads as default values with zero error, corrupting saves invisibly."
    adr: docs/architecture/adr-0001-save-system.md
    added: 2026-04-30

  - pattern: per_component_isaveable
    status: active
    description: "Do not introduce an ISaveable interface that lets every component own its own serialised format. The save schema must be visible in one file (the GameSave DTO graph) so migrators can be written against it."
    why: "Migration is the make-or-break property of the save system. Scattering schema across N components makes the format unknowable in aggregate, blocks meaningful schema diffs, and makes load-order bugs impossible to find."
    adr: docs/architecture/adr-0001-save-system.md
    added: 2026-04-30

